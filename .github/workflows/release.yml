name: Release

# Run it by hand from the Actions tab (on main): it bumps the version, publishes to npm, pushes the version commit and
# the tag, and creates the GitHub release with generated release notes.
on:
  workflow_dispatch:
    inputs:
      releaseType:
        description: Release type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      distTag:
        description: npm tag, use "next" for a test version
        required: true
        default: latest

permissions:
  # Push the version commit and the tag, and create the release
  contents: write
  # npm trusted publishing (no npm token is stored in GitHub) and the provenance statement
  id-token: write

jobs:
  release:
    # Only from main, and only by the owner of the repository
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No registry-url on setup-node: it writes a dummy auth token that npm would use instead of trusted publishing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build before npm looks at package.json: it removes a bin that does not exist yet from what it publishes
      - run: npm run build
      - run: npm test
      - name: Bump the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.releaseType }} -m "Release %s"
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Publish to npm
        run: npm publish --provenance --access public --tag ${{ inputs.distTag }} --loglevel verbose
      - name: Push the version commit and the tag
        run: git push origin main --follow-tags
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [ "${{ inputs.distTag }}" != "latest" ]; then PRERELEASE="--prerelease"; fi
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes $PRERELEASE
